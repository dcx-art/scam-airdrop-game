name: Deploy SCAM Mini App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Each attempt gets its own artifact name. This prevents a rerun
      # from colliding with an artifact retained from an earlier attempt.
      - name: Set unique Pages artifact name
        id: pages-artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: .

      - name: Allow Pages artifact metadata to propagate
        run: sleep 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ steps.pages-artifact.outputs.name }}
